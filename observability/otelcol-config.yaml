# OpenTelemetry Collector (core distribution) for the Pond Planner.
#
#   pond app (sys1) --OTLP/HTTP--> this collector (sys2:4318) --OTLP/HTTP--> OpenObserve (sys2:3000)
#
# OO_BASIC_AUTH = base64("<openobserve user>:<password>"), set by start.sh.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuse data before the 512 MB container runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_mib: 100
    spike_limit_mib: 25
  # Send in groups instead of one HTTP call per span / log line.
  batch:
    timeout: 5s
    send_batch_size: 512
  # Tag everything that passed through this collector.
  resource:
    attributes:
      - key: collector.host
        value: stu27_sys2
        action: upsert

exporters:
  otlp_http/openobserve:
    endpoint: http://127.0.0.1:3000/api/default
    headers:
      Authorization: "Basic ${env:OO_BASIC_AUTH}"
    retry_on_failure:
      enabled: true
  # Prints a one-line summary of every batch to collector.log.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/openobserve, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/openobserve, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/openobserve, debug]
  telemetry:
    logs:
      level: info
